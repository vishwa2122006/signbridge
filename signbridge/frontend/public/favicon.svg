<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>SignBridge</title>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4f9a"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#2ee6c5"/>
    </linearGradient>
    <!-- ✌ hand: V fingers, curled ring + little finger, thumb out to the side -->
    <g id="hand">
      <rect x="11.755" y="31.5" width="59.49" height="13" rx="6.5" transform="rotate(-108.83 41.5 38)"/>
      <rect x="35.27" y="33.5" width="56.46" height="13" rx="6.5" transform="rotate(-66.97 63.5 40)"/>
      <rect x="48.9" y="59.5" width="40.2" height="13" rx="6.5" transform="rotate(-36.03 69 66)"/>
      <path d="M28 48 H60 A6 6 0 0 1 66 54 V72 A16 16 0 0 1 50 88 H42 A18 18 0 0 1 24 70 V52 A4 4 0 0 1 28 48 Z"/>
      <rect x="20" y="46" width="13" height="22" rx="6.5"/>
      <rect x="31" y="44" width="13" height="24" rx="6.5"/>
    </g>
  </defs>

  <rect x="3" y="3" width="94" height="94" rx="25" fill="url(#brand)"/>
  <ellipse cx="32" cy="17" rx="26" ry="11" fill="#ffffff" opacity="0.14"/>

  <!-- outline pass then fill pass, so the shapes read as one bold outlined hand -->
  <g transform="translate(50 51) scale(0.84) translate(-53.25 -48.75)">
    <use href="#hand" fill="#1e0b45" stroke="#1e0b45" stroke-width="10" stroke-linejoin="round"/>
    <use href="#hand" fill="#ffffff"/>
    <!-- the two curled fingers as separate rounded knuckles -->
    <rect x="20" y="46" width="13" height="22" rx="6.5" fill="#ffffff" stroke="#1e0b45" stroke-width="5"/>
    <rect x="31" y="44" width="13" height="24" rx="6.5" fill="#ffffff" stroke="#1e0b45" stroke-width="5"/>
  </g>
</svg>
